services:
  mm-budget:
    image: melojms/mm-budget:${VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: mm-budget
    restart: unless-stopped
    user: "${PUID:-65532}:${PGID:-65532}"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${DATA_LOCATION:-./data}:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/mm-budget", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
