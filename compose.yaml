services:
  mealheiro:
    image: ghcr.io/melojms/mealheiro:${VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: mealheiro
    restart: unless-stopped
    user: "${PUID:-65532}:${PGID:-65532}"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      PORT: ${PORT:-7447}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HOST_PORT:-7447}:${PORT:-7447}"
    volumes:
      - ${DATA_LOCATION:-./data}:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/mealheiro", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
