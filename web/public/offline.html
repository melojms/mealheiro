<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>Offline · Mealheiro</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #525252;
        --brand: #10b981;
        --brand-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 320px; }
      .pig { font-size: 64px; line-height: 1; }
      h1 { margin: 16px 0 8px; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: var(--brand-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="pig" aria-hidden="true">🐷</div>
      <h1>Mealheiro</h1>
      <p>You're offline — reconnect to add expenses.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
